<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tables and Lists</title>
  <style>
    body { font-family: Arial; margin: 25px; }
    table { border-collapse: collapse; width: 60%; }
    th, td { border: 1px solid black; padding: 10px; }
    th { background: #dceafa; }
  </style>
</head>
<body>
  <h1>Student Details</h1>
  <table>
    <tr><th>Roll No</th><th>Name</th><th>Branch</th></tr>
    <tr><td>101</td><td>Arun</td><td>CSE</td></tr>
    <tr><td>102</td><td>Ravi</td><td>IT</td></tr>
    <tr><td>103</td><td>Priya</td><td>ECE</td></tr>
  </table>
  <h2>Programming Languages</h2>
  <ul><li>C</li><li>Java</li><li>Python</li></ul>
  <h2>Steps to develop a project</h2>
  <ol><li>Plan</li><li>Develop</li><li>Test</li><li>Deploy</li></ol>
</body>
</html>
